<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Imperium Urbis — vidéo de présentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./motion.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="c"></canvas>
      <div id="veil"></div>
      <div id="title" class="center">
        <p class="kicker">Une province vous attend</p>
        <h1 class="letters"><span>I</span><span>M</span><span>P</span><span>E</span><span>R</span><span>I</span><span>V</span><span>M</span><span class="sp"> </span><span>V</span><span>R</span><span>B</span><span>I</span><span>S</span></h1>
        <div id="rule"></div>
        <p class="sub">Bâtisseur de cités romaines</p>
      </div>
      <div id="cap"><span id="capn"></span><div><h2 id="capt"></h2><p id="caps"></p><div class="bar"><div id="capbar"></div></div></div></div>
      <div id="prov"></div>
      <div id="end" class="center">
        <h1>IMPERIVM VRBIS</h1>
        <div class="rule"></div>
        <p class="sub">Fondez une cité. Gouvernez une province.</p>
        <p class="cta">Jouez dans votre navigateur</p>
      </div>
    </div>
    <script type="module" src="./motion.js"></script>
  </body>
</html>
