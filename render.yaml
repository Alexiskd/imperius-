services:
  - type: web
    runtime: node
    name: imperium-urbis-app
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /index.html
    autoDeployTrigger: commit
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PRIX
        value: "9.99"
      - key: COOKIE_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
