services:
  - type: web
    runtime: node
    name: imperium-urbis-app
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /index.html
    autoDeployTrigger: commit
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        value: https://imperium-urbis.onrender.com
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: PRIX
        value: "13.5"
      - key: COOKIE_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
