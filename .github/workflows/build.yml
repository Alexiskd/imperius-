name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Vérifie les pages statiques
        run: |
          test -f dist/index.html && test -f dist/jeu.html && test -f dist/achat.html
          test -f dist/video/presentation.mp4
          test -f dist/robots.txt && grep -q "Sitemap:" dist/robots.txt && test -f dist/sitemap.xml
          ! grep -q "%SITE_URL%" dist/index.html
          (PORT=3999 node server/index.mjs &) && sleep 1
          curl -fsS http://localhost:3999/api/achat/config
          test "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3999/jeu.html)" = 302
          ls -la dist dist/assets
