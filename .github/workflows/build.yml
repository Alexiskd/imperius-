name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Vérifie les pages statiques
        run: |
          test -f dist/index.html && test -f dist/jeu.html && test -f dist/achat.html
          test -f dist/video/presentation.mp4
          ls -la dist dist/assets
